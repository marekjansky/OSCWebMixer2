services:
  webmixer:
    image: oscwebmixer2:latest
    container_name: webmixer
    restart: unless-stopped
    network_mode: host
    volumes:
      - ./config:/webmixer/config
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    # Healthy = the web server answers /healthz. The port is read from the saved config (default 80);
    # PORT in `environment:` overrides it for the check only. (network_mode host, so 127.0.0.1 is the host.)
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "const fs=require('fs');let p=80;try{p=JSON.parse(fs.readFileSync('/webmixer/config/global.json','utf8')).server.port||80}catch(e){}require('http').get({host:'127.0.0.1',port:process.env.PORT||p,path:'/healthz',timeout:4000},r=>process.exit(r.statusCode==200?0:1)).on('error',()=>process.exit(1))"
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 20s
