name: release

# Push a tag like v2.6.0 (must match "version" in package.json) to build every platform natively
# and publish a GitHub release. "Run workflow" (manual) builds the same zips as artifacts only.
on:
  push:
    tags: [ 'v*' ]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
      - run: npm ci
      - run: npm test
      - name: Check minified assets are up to date
        run: |
          npm run build
          git diff --exit-code -- web/mixer.min.js web/mixer.min.css \
            || (echo "::error::web/mixer.min.* is stale - run 'npm run build' and commit the result" && exit 1)
      - name: Check tag matches package.json version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          VERSION="$(node -p 'require("./package.json").version')"
          if [ "${GITHUB_REF_NAME}" != "v${VERSION}" ]; then
            echo "::error::Tag ${GITHUB_REF_NAME} does not match package.json version ${VERSION}"
            exit 1
          fi

  package:
    needs: test
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest,  target: node22-linux-x64,   platform: linux-x64,   exe: OSCWebMixer2,     scripts: linux }
          - { os: windows-latest, target: node22-win-x64,     platform: windows-x64, exe: OSCWebMixer2.exe, scripts: windows }
          - { os: macos-latest,   target: node22-macos-arm64, platform: macos-arm64, exe: OSCWebMixer2,     scripts: macos }
          - { os: macos-15-intel, target: node22-macos-x64,   platform: macos-x64,   exe: OSCWebMixer2,     scripts: macos }
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
      - run: npm ci
      - run: npm run build

      - name: Build executable
        run: npx pkg . --targets ${{ matrix.target }} --output "stage/OSCWebMixer2/${{ matrix.exe }}"

      - name: Ad-hoc sign (macOS)
        if: runner.os == 'macOS'
        run: codesign --force --sign - "stage/OSCWebMixer2/${{ matrix.exe }}"

      - name: Smoke test (starts and serves /healthz)
        run: |
          mkdir -p "$RUNNER_TEMP/smoke-config"
          printf '{"server":{"port":18080},"osc":{"port":18000},"desk":{"ip":"127.0.0.1","port":19000}}' > "$RUNNER_TEMP/smoke-config/global.json"
          OSCWEBMIXER_CONFIG_DIR="$RUNNER_TEMP/smoke-config" OSCWEBMIXER_PLUGINS_DIR="$RUNNER_TEMP/smoke-plugins" \
            "stage/OSCWebMixer2/${{ matrix.exe }}" > "$RUNNER_TEMP/smoke.log" 2>&1 &
          PID=$!
          for i in $(seq 1 30); do
            if node -e 'fetch("http://127.0.0.1:18080/healthz").then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))'; then OK=1; break; fi
            sleep 1
          done
          kill $PID 2>/dev/null || true
          cat "$RUNNER_TEMP/smoke.log"
          [ "${OK:-0}" = 1 ] || (echo "::error::Packaged executable did not serve /healthz" && exit 1)

      - name: Assemble folder
        run: |
          cp -R plugins stage/OSCWebMixer2/plugins
          cp README.md LICENSE stage/OSCWebMixer2/
          cp packaging/${{ matrix.scripts }}/* stage/OSCWebMixer2/
          chmod +x stage/OSCWebMixer2/start.* "stage/OSCWebMixer2/${{ matrix.exe }}" || true

      - name: Zip
        run: |
          REF="${GITHUB_REF_NAME////-}"
          NAME="OSCWebMixer2-${REF}-${{ matrix.platform }}.zip"
          cd stage
          if [ "$RUNNER_OS" = "Windows" ]; then 7z a -tzip "../$NAME" OSCWebMixer2 > /dev/null; else zip -qry "../$NAME" OSCWebMixer2; fi
          echo "ZIP=$NAME" >> "$GITHUB_ENV"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.platform }}
          path: ${{ env.ZIP }}

  release:
    needs: package
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: assets
          merge-multiple: true
      - name: Checksums
        run: cd assets && sha256sum *.zip > SHA256SUMS.txt && cat SHA256SUMS.txt
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          PRERELEASE=""
          case "$GITHUB_REF_NAME" in *-*) PRERELEASE="--prerelease" ;; esac
          gh release create "$GITHUB_REF_NAME" assets/* \
            --repo "$GITHUB_REPOSITORY" \
            --title "OSC Web Mixer $GITHUB_REF_NAME" \
            --generate-notes --verify-tag $PRERELEASE
